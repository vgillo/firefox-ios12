name: Build Reynard iOS 12

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Show environment
        run: |
          sw_vers
          xcodebuild -version
          python3 --version
          git --version

      - name: Install dependencies
        run: |
          brew update
          brew install rustup-init ldid
          rustup-init -y
          source "$HOME/.cargo/env"
          rustc --version
          cargo --version
          ldid -h

      - name: Configure Rust
        run: |
          source "$HOME/.cargo/env"
          rustup default stable
          rustup target add aarch64-apple-ios

      - name: Initialize submodules
        run: |
          git submodule update --init --recursive

      - name: Download Gecko
        run: |
          chmod +x tools/development/update-gecko.sh
          ./tools/development/update-gecko.sh

      - name: Apply Gecko patches
        run: |
          chmod +x tools/development/apply-patches.sh
          ./tools/development/apply-patches.sh

      - name: Build idevice
        run: |
          source "$HOME/.cargo/env"
          chmod +x tools/development/build-idevice.sh
          ./tools/development/build-idevice.sh

      - name: Build Gecko
        run: |
          source "$HOME/.cargo/env"
          chmod +x tools/development/build-gecko.sh
          ./tools/development/build-gecko.sh

      - name: Build Reynard
        run: |
          xcodebuild build \
            -project browser/Reynard.xcodeproj \
            -scheme Reynard \
            -configuration Debug \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="-" \
            -derivedDataPath "$RUNNER_TEMP/ReynardDD"

      - name: Sign application with ldid
        run: |
          APP="$RUNNER_TEMP/ReynardDD/Build/Products/Debug-iphoneos/Reynard.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: Reynard.app introuvable"
            exit 1
          fi

          ldid \
            -Sbrowser/Reynard/Entitlements/Reynard.private.entitlements \
            "$APP/Reynard"

      - name: Create IPA
        run: |
          APP="$RUNNER_TEMP/ReynardDD/Build/Products/Debug-iphoneos/Reynard.app"

          mkdir -p Payload
          cp -R "$APP" Payload/Reynard.app

          zip -r Reynard-iOS12.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-iOS12-IPA
          path: Reynard-iOS12.ipa
